name: city-hospital

services:
  db:
    image: postgres:15-alpine
    container_name: pgsql_ctr
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    ports: 
      - 5433:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data 
    networks:
      - hospital_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s  

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: api_ctr
    restart: unless-stopped
    env_file: 
      - ./.env
    ports: 
      - 5113:8000 
    volumes:
      - .:/var/www/html 
    networks:
      - hospital_network
    command: >
      sh -c "composer update --no-interaction --prefer-dist &&
         php artisan migrate --force &&
         php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db: 
        condition: service_healthy

  vite:
    image: node:20-alpine
    container_name: vite_ctr
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    networks:
      - hospital_network
    command: sh -c "npm install && npm run dev -- --host"
    ports:
      - 5173:5173 

networks:
  hospital_network:
    driver: bridge

volumes: 
  postgres_data: